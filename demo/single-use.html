<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Safety Patterns — Single-use authority</title><style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#edf3fa;font:16px/1.6 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}small,.muted{color:#a9bbce}h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:30px 0 12px}button,select{font:inherit;color:inherit;background:#26374b;border:1px solid #58718d;border-radius:8px;padding:10px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #8bdcff}button.primary{background:#bce7ff;color:#102237;font-weight:700;border:0}section{border:1px solid #36475c;border-radius:14px;padding:20px;margin:18px 0;background:#172232}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{min-width:0;padding:14px;background:#101722;border-radius:10px}.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:14px 0}.cell{aspect-ratio:1;border:1px solid #536378;border-radius:4px;display:grid;place-items:center;font-size:12px}.cell{transition:background-color .18s ease} @media(prefers-reduced-motion:reduce){.cell{transition:none}} .bad{background:#a72c3c}.good{background:#176b50}.denied{background:#36475c}.count{font-size:30px;font-weight:700}a{color:#bce7ff}pre{white-space:pre-wrap;font-size:13px} @media(max-width:550px){main{padding:16px}.panels{grid-template-columns:1fr}} </style></head><body><main><header><small>VERITAS / AI SAFETY PATTERNS / 01</small><button id="lang">日本語</button></header><h1 data-t="title"></h1><p class="muted" data-t="intro"></p><section><div class="controls"><label for="n" data-t="requests"></label><select id="n"><option>2</option><option>8</option><option selected>32</option><option>64</option></select><button class="primary" id="run" data-t="run"></button><button id="reset" data-t="reset"></button></div><div class="panels"><div class="panel"><h2 data-t="unsafe"></h2><div class="count" id="uc">—</div><div class="cells" id="ug" aria-hidden="true"></div><p data-t="unsafeDesc"></p></div><div class="panel"><h2 data-t="safe"></h2><div class="count" id="sc">—</div><div class="cells" id="sg" aria-hidden="true"></div><p data-t="safeDesc"></p></div></div><p id="result" role="status"></p></section><section><h2 data-t="limitsTitle"></h2><p data-t="limits"></p><p data-t="python"></p><a id="all-labs" href="index.html">All labs / 教材一覧</a> · <a href="https://github.com/veritasfuji-japan/ai-safety-patterns">GitHub</a> · <a href="https://github.com/veritasfuji-japan/veritas_os">VERITAS OS ↗</a></section></main><script>
const strings={en:{title:'One approval. One authority consumption.',intro:'Explore a deliberately scheduled check-then-act race. No money, API calls or external actions are involved.',requests:'Concurrent requests',run:'Run simulation',reset:'Reset',unsafe:'Unsafe design',safe:'Atomic design',unsafeDesc:'Every request checks the unused flag before any request writes it.',safeDesc:'Each request checks and consumes in one indivisible step.',limitsTitle:'What this demonstrates',limits:'This is a deterministic simulation, not a browser concurrency test. It demonstrates grants, not completed external effects. It does not prove durable storage, approval authenticity, revocation or exactly-once execution.',python:'The accompanying Python tests exercise actual threads in a single process.',grants:'grants',denials:'denials'},ja:{title:'1回の承認。1回の権限消費。',intro:'確認と更新の競合を意図的に再現します。送金・API通信・外部操作は行いません。',requests:'並行要求数',run:'シミュレーション実行',reset:'リセット',unsafe:'危険な設計',safe:'原子的な設計',unsafeDesc:'すべての要求が未消費状態を確認してから、消費状態を更新します。',safeDesc:'確認と消費を分割できない一つの操作として行います。',limitsTitle:'保証範囲',limits:'決定論的なシミュレーションであり、ブラウザの実並行処理テストではありません。実行許可を示すもので、外部処理の完了を示しません。永続化・承認の真正性・取消し・外部処理の一回限りの成立は保証しません。',python:'付属のPythonテストは単一プロセス内で実際のスレッドを使用します。',grants:'許可',denials:'拒否'}};
let lang=new URLSearchParams(location.search).get('lang')==='ja'?'ja':'en',ran=false;const $=id=>document.getElementById(id);function simulate(n,atomic){let consumed=false; if(!atomic){const checked=Array.from({length:n},()=>!consumed);return checked.map(ok=>{if(ok)consumed=true;return ok})}return Array.from({length:n},()=>{if(consumed)return false;consumed=true;return true})}function render(){const t=strings[lang],n=Number($('n').value);document.documentElement.lang=lang;$('all-labs').href='index.html'+(lang==='ja'?'?lang=ja':'');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);$('lang').textContent=lang==='en'?'日本語':'English';for(const [g,c,atomic] of [['ug','uc',false],['sg','sc',true]]){const results=simulate(n,atomic);$(g).replaceChildren();for(const ok of results){const e=document.createElement('span');e.className='cell'+(ran?' '+(ok?(atomic?'good':'bad'):'denied'):'');e.textContent=ran?(ok?'✓':'×'):'·';$(g).append(e)}$(c).textContent=ran?`${results.filter(Boolean).length} / ${n} ${t.grants}`:'—'}$('result').textContent=ran?`${t.unsafe}: ${n} ${t.grants}, 0 ${t.denials}. ${t.safe}: 1 ${t.grants}, ${n-1} ${t.denials}.`:''} $('run').onclick=()=>{ran=true;render()};$('reset').onclick=$('n').onchange=()=>{ran=false;render()};$('lang').onclick=()=>{lang=lang==='en'?'ja':'en';render()};render();</script></body></html>
